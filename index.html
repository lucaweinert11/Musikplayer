<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>PSF Stegen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0f; --surface:#12121a; --surface2:#1a1a26;
    --accent:#e8d5b0; --accent2:#c4a882; --red:#d0191e;
    --amber:#f5a623; --text:#e8e4dc; --muted:#6b6878;
    --border:rgba(232,213,176,0.1); --glow:rgba(245,166,35,0.15);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text);
    height:100dvh; overflow:hidden; display:flex; flex-direction:column;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:9999; opacity:0.35;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  }

  /* HEADER */
  header { padding:14px 18px 0; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .logo-wrap { display:flex; align-items:center; gap:10px; }
  .logo-svg { width:50px; height:50px; flex-shrink:0; filter:drop-shadow(0 2px 10px rgba(208,25,30,0.45)); }
  .logo-text { display:flex; flex-direction:column; gap:1px; }
  .logo-psf { font-size:10px; font-weight:600; letter-spacing:4px; color:#c4a882; text-transform:uppercase; }
  .logo-stegen { font-size:17px; font-weight:800; letter-spacing:5px; color:#fff; text-transform:uppercase; line-height:1; }
  .track-count { font-size:11px; font-weight:300; color:var(--muted); letter-spacing:1.5px; }

  /* TABS */
  .tabs { display:flex; padding:10px 18px 0; border-bottom:1px solid var(--border); flex-shrink:0; }
  .tab {
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase; font-weight:500;
    color:var(--muted); padding:7px 15px 10px; cursor:pointer;
    border-bottom:2px solid transparent; transition:all 0.2s;
    background:none; border-top:none; border-left:none; border-right:none; font-family:'Nunito',sans-serif;
  }
  .tab.active { color:var(--accent); border-bottom-color:var(--red); }

  /* SEARCH */
  .search-bar { padding:10px 18px; flex-shrink:0; }
  .search-wrap { position:relative; }
  .search-wrap svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:13px; height:13px; stroke:var(--muted); }
  #searchInput {
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:8px;
    color:var(--text); font-family:'Nunito',sans-serif; font-size:13px; font-weight:400;
    padding:9px 13px 9px 36px; outline:none; transition:border-color 0.2s;
  }
  #searchInput:focus { border-color:var(--accent2); }
  #searchInput::placeholder { color:var(--muted); }

  /* DROP ZONE */
  #dropZone {
    margin:0 18px 10px; border:1.5px dashed var(--border); border-radius:10px;
    padding:14px; text-align:center; cursor:pointer; transition:all 0.2s; flex-shrink:0;
  }
  #dropZone:hover, #dropZone.drag-over { border-color:var(--red); background:rgba(208,25,30,0.06); }
  #dropZone p { font-size:12px; font-weight:300; color:var(--muted); }
  #dropZone strong { color:var(--accent); font-size:13px; font-weight:600; display:block; margin-bottom:2px; letter-spacing:0.5px; }
  #fileInput { display:none; }

  /* PANELS */
  .panel { display:none; flex:1; overflow-y:auto; padding:0 18px 6px; min-height:0; }
  .panel.active { display:block; }

  /* TRACK ITEMS */
  .track-item {
    display:flex; align-items:center; gap:11px; padding:10px 11px;
    border-radius:8px; cursor:pointer; transition:background 0.15s;
    margin-bottom:2px; position:relative; animation:fadeIn 0.2s ease both;
  }
  .track-item:hover { background:var(--surface); }
  .track-item.playing { background:var(--surface2); }
  .track-item.playing::before {
    content:''; position:absolute; left:0; top:18%; height:64%; width:2px;
    background:var(--red); border-radius:2px;
  }
  .track-num { width:20px; text-align:center; font-size:11px; color:var(--muted); flex-shrink:0; }
  .track-item.playing .track-num { color:var(--red); }
  .track-art { width:38px; height:38px; border-radius:6px; background:var(--surface2); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:15px; }
  .track-info { flex:1; min-width:0; }
  .track-title { font-size:13px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-item.playing .track-title { color:var(--accent); }
  .track-meta { font-size:11px; font-weight:300; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-dur { font-size:11px; font-weight:300; color:var(--muted); flex-shrink:0; }
  .add-queue-btn { background:none; border:none; cursor:pointer; color:var(--muted); padding:4px; border-radius:4px; transition:color 0.15s; display:flex; flex-shrink:0; }
  .add-queue-btn:hover { color:var(--red); }

  /* QUEUE */
  .queue-header { display:flex; align-items:center; justify-content:space-between; padding:8px 0 10px; }
  .queue-header h3 { font-size:11px; font-weight:500; letter-spacing:1.5px; color:var(--muted); text-transform:uppercase; }
  .clear-btn { font-size:12px; font-weight:400; color:var(--muted); background:none; border:none; cursor:pointer; font-family:'Nunito',sans-serif; transition:color 0.15s; }
  .clear-btn:hover { color:var(--red); }
  .queue-empty { text-align:center; padding:30px 0; font-size:12px; color:var(--muted); letter-spacing:0.5px; line-height:1.7; }
  .queue-item { display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:8px; margin-bottom:2px; background:var(--surface); }
  .queue-pos { font-size:10px; color:var(--muted); width:16px; flex-shrink:0; text-align:center; }
  .queue-info { flex:1; min-width:0; }
  .queue-title { font-size:13px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .queue-remove { background:none; border:none; cursor:pointer; color:var(--muted); padding:4px; transition:color 0.15s; display:flex; }
  .queue-remove:hover { color:#e05c5c; }

  /* NOW PLAYING BAR */
  #nowPlayingBar {
    background:linear-gradient(180deg,#0d0d16 0%,#111119 100%);
    border-top:1px solid var(--border);
    flex-shrink:0; transition:transform 0.4s cubic-bezier(.4,0,.2,1), opacity 0.3s;
  }
  #nowPlayingBar.hidden { transform:translateY(100%); opacity:0; pointer-events:none; }

  /* SEEK SLIDER */
  .seek-wrap {
    display:flex; align-items:center; gap:8px;
    padding:4px 16px 2px;
  }
  .time-label {
    font-size:11px; font-weight:300; color:var(--muted);
    flex-shrink:0; min-width:34px; letter-spacing:0.3px; font-variant-numeric:tabular-nums;
  }
  #timeTotal { text-align:right; }

  #seekBar {
    flex:1; -webkit-appearance:none; appearance:none;
    height:4px; border-radius:2px; outline:none; cursor:pointer;
    background:var(--surface2); /* updated live by JS */
  }
  #seekBar::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:20px; height:20px; border-radius:50%;
    background:#fff; border:2px solid var(--red);
    box-shadow:0 0 6px rgba(0,0,0,0.6), 0 0 10px rgba(208,25,30,0.35);
    margin-top:-8px;
  }
  #seekBar::-webkit-slider-runnable-track { height:4px; border-radius:2px; }
  #seekBar::-moz-range-thumb {
    width:18px; height:18px; border-radius:50%;
    background:#fff; border:2px solid var(--red); box-shadow:0 0 5px rgba(0,0,0,0.5);
  }
  #seekBar::-moz-range-track { height:4px; border-radius:2px; background:var(--surface2); }
  #seekBar::-moz-range-progress { height:4px; border-radius:2px; background:var(--red); }

  /* VOLUME */
  .volume-wrap {
    display:flex; align-items:center; gap:8px;
    padding:4px 16px 10px;
  }
  .volume-icon { color:var(--muted); flex-shrink:0; display:flex; }
  #volumeBar {
    flex:1; -webkit-appearance:none; appearance:none;
    height:3px; border-radius:2px; outline:none; cursor:pointer;
    background:var(--surface2);
  }
  #volumeBar::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:16px; height:16px; border-radius:50%;
    background:#fff; border:2px solid var(--amber);
    box-shadow:0 0 5px rgba(0,0,0,0.5);
    margin-top:-6px;
  }
  #volumeBar::-webkit-slider-runnable-track { height:3px; border-radius:2px; }
  #volumeBar::-moz-range-thumb {
    width:14px; height:14px; border-radius:50%;
    background:#fff; border:2px solid var(--amber);
  }
  #volumeBar::-moz-range-track { height:3px; border-radius:2px; background:var(--surface2); }

  /* Player body: CD left, info right */
  .player-body { display:flex; align-items:center; padding:8px 16px 4px; gap:12px; }

  /* SPINNING CD */
  .cd-wrap { flex-shrink:0; width:70px; height:70px; }
  .cd { width:70px; height:70px; border-radius:50%; animation:spinCD 3.5s linear infinite; animation-play-state:paused; position:relative; }
  .cd.spinning { animation-play-state:running; }
  @keyframes spinCD { to { transform:rotate(360deg); } }
  .cd::after {
    content:''; position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:conic-gradient(transparent 0deg,rgba(255,255,255,0.07) 15deg,transparent 35deg,rgba(255,255,255,0.04) 90deg,transparent 130deg,rgba(255,255,255,0.09) 170deg,transparent 210deg,rgba(255,255,255,0.03) 270deg,transparent 310deg,rgba(255,255,255,0.06) 350deg,transparent 360deg);
  }
  .cd svg { width:70px; height:70px; display:block; }

  /* SEEK SLIDER */
  .seek-wrap { display:flex; align-items:center; gap:8px; padding:2px 16px 2px; }
  .time-label { font-size:11px; font-weight:300; color:var(--muted); flex-shrink:0; min-width:34px; letter-spacing:0.3px; font-variant-numeric:tabular-nums; }
  #timeTotal { text-align:right; }
  #seekBar { flex:1; -webkit-appearance:none; appearance:none; height:4px; border-radius:2px; outline:none; cursor:pointer; background:var(--surface2); }
  #seekBar::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:18px; height:18px; border-radius:50%; background:#fff; border:2px solid var(--red); box-shadow:0 0 6px rgba(0,0,0,0.6); margin-top:-7px; }
  #seekBar::-webkit-slider-runnable-track { height:4px; border-radius:2px; }
  #seekBar::-moz-range-thumb { width:16px; height:16px; border-radius:50%; background:#fff; border:2px solid var(--red); }
  #seekBar::-moz-range-track { height:4px; border-radius:2px; background:var(--surface2); }
  #seekBar::-moz-range-progress { height:4px; border-radius:2px; background:var(--red); }

  /* VOLUME */
  .volume-wrap { display:flex; align-items:center; gap:8px; padding:2px 16px 4px; }
  .volume-icon { color:var(--muted); flex-shrink:0; display:flex; }
  #volumeBar { flex:1; -webkit-appearance:none; appearance:none; height:3px; border-radius:2px; outline:none; cursor:pointer; background:var(--surface2); }
  #volumeBar::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:15px; height:15px; border-radius:50%; background:#fff; border:2px solid var(--amber); box-shadow:0 0 4px rgba(0,0,0,0.5); margin-top:-6px; }
  #volumeBar::-webkit-slider-runnable-track { height:3px; border-radius:2px; }
  #volumeBar::-moz-range-thumb { width:13px; height:13px; border-radius:50%; background:#fff; border:2px solid var(--amber); }
  #volumeBar::-moz-range-track { height:3px; border-radius:2px; background:var(--surface2); }

  /* DRAG & DROP QUEUE */
  .queue-item { display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:8px; margin-bottom:2px; background:var(--surface); transition:opacity 0.15s, transform 0.15s; cursor:default; }
  .queue-item.dragging { opacity:0.4; transform:scale(0.98); }
  .queue-item.drag-over-item { border-top:2px solid var(--red); }
  .drag-handle { color:var(--muted); cursor:grab; flex-shrink:0; display:flex; padding:2px; touch-action:none; }
  .drag-handle:active { cursor:grabbing; color:var(--amber); }

  /* Info */
  .now-info { flex:1; min-width:0; }
  .now-title { font-family:'Cormorant Garamond',serif; font-size:16px; font-style:italic; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .now-artist { font-size:11px; font-weight:300; color:var(--muted); letter-spacing:1.5px; margin-top:2px; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* CONTROLS */
  .controls-row { display:flex; align-items:center; justify-content:center; gap:4px; padding:2px 16px 10px; }
  .ctrl-btn { background:none; border:none; cursor:pointer; color:var(--text); padding:8px; border-radius:50%; transition:all 0.15s; display:flex; }
  .ctrl-btn:hover { color:var(--amber); transform:scale(1.1); }
  .ctrl-btn.active { color:var(--amber); }

  #playBtn {
    width:46px; height:46px; background:var(--red); border-radius:50%; color:#fff;
    display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;
    transition:all 0.15s; box-shadow:0 0 16px rgba(208,25,30,0.45);
    flex-shrink:0;
  }
  #playBtn:hover { transform:scale(1.07); background:#e81c21; }

  #stopBtn {
    width:36px; height:36px; background:var(--surface2); border:1px solid var(--border);
    border-radius:50%; color:var(--text); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all 0.15s; flex-shrink:0;
  }
  #stopBtn:hover { color:var(--amber); border-color:var(--amber); }

  /* Misc */
  ::-webkit-scrollbar { width:3px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
  .empty-state { text-align:center; padding:40px 0 24px; }
  .empty-state .icon { font-size:42px; margin-bottom:12px; opacity:0.4; }
  .empty-state p { font-size:12px; font-weight:300; color:var(--muted); letter-spacing:0.5px; line-height:2; }
  #toast {
    position:fixed; bottom:120px; left:50%; transform:translateX(-50%);
    background:var(--surface2); border:1px solid var(--border); color:var(--accent);
    font-size:12px; font-weight:400; letter-spacing:0.5px; padding:9px 18px;
    border-radius:20px; opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:1000; white-space:nowrap;
  }
  #toast.show { opacity:1; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
  .shuffle-icon { transition:transform 0.3s; }
  .ctrl-btn.active .shuffle-icon { transform:rotate(180deg); }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo-wrap">
    <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="48" fill="white"/>
      <!-- P -->
      <rect x="12" y="18" width="7" height="38" fill="#d0191e" rx="1"/>
      <rect x="12" y="18" width="16" height="7" fill="#d0191e" rx="1"/>
      <rect x="12" y="31" width="14" height="6" fill="#d0191e" rx="1"/>
      <rect x="21" y="18" width="7" height="19" fill="#d0191e" rx="1"/>
      <!-- S -->
      <rect x="34" y="18" width="16" height="6" fill="#d0191e" rx="1"/>
      <rect x="34" y="18" width="7" height="13" fill="#d0191e" rx="1"/>
      <rect x="34" y="29" width="16" height="6" fill="#d0191e" rx="1"/>
      <rect x="43" y="35" width="7" height="13" fill="#d0191e" rx="1"/>
      <rect x="34" y="48" width="16" height="6" fill="#d0191e" rx="1"/>
      <!-- F -->
      <rect x="56" y="18" width="7" height="38" fill="#d0191e" rx="1"/>
      <rect x="56" y="18" width="18" height="7" fill="#d0191e" rx="1"/>
      <rect x="56" y="31" width="14" height="6" fill="#d0191e" rx="1"/>
      <!-- Speaker -->
      <g transform="translate(55,62)">
        <rect x="0" y="3" width="7" height="9" fill="#d0191e" rx="1"/>
        <polygon points="7,1 7,14 14,18 14,0" fill="#d0191e"/>
        <path d="M16,4 Q20,8 16,12" stroke="#d0191e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M19,1 Q25,8 19,15" stroke="#d0191e" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </g>
      <!-- STEGEN -->
      <rect x="12" y="79" width="60" height="13" fill="#d0191e" rx="2"/>
      <text x="42" y="89.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" font-weight="700" fill="white" letter-spacing="2.5">STEGEN</text>
    </svg>
    <div class="logo-text">
      <div class="logo-psf">PSF</div>
      <div class="logo-stegen">Stegen</div>
    </div>
  </div>
  <div class="track-count" id="trackCount">0 Tracks</div>
</header>

<!-- TABS -->
<div class="tabs">
  <button class="tab active" onclick="switchTab('library')">Bibliothek</button>
  <button class="tab" onclick="switchTab('queue')">Warteschlange <span id="queueBadge"></span></button>
</div>

<!-- SEARCH -->
<div class="search-bar">
  <div class="search-wrap">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="Suchen..." oninput="filterTracks()">
  </div>
</div>

<!-- DROP ZONE -->
<div id="dropZone" onclick="document.getElementById('fileInput').click()">
  <strong>+ Dateien laden</strong>
  <p>MP3 &amp; M4A auswählen oder hier ablegen</p>
  <input type="file" id="fileInput" multiple accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac">
</div>

<!-- LIBRARY PANEL -->
<div class="panel active" id="panel-library">
  <div id="trackList">
    <div class="empty-state">
      <div class="icon">🎵</div>
      <p>Keine Tracks geladen<br>Dateien oben hinzufügen</p>
    </div>
  </div>
</div>

<!-- QUEUE PANEL -->
<div class="panel" id="panel-queue">
  <div class="queue-header">
    <h3>Als nächstes</h3>
    <button class="clear-btn" onclick="clearQueue()">Alles löschen</button>
  </div>
  <div id="queueList">
    <div class="queue-empty">Warteschlange leer —<br>spielt automatisch von vorne durch</div>
  </div>
</div>

<!-- NOW PLAYING BAR -->
<div id="nowPlayingBar" class="hidden">

  <!-- CD + Info -->
  <div class="player-body">
    <div class="cd-wrap">
      <div class="cd" id="cdDisc">
        <svg viewBox="0 0 82 82" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="dg" cx="50%" cy="50%" r="50%">
              <stop offset="0%"  stop-color="#2c2c3e"/>
              <stop offset="42%" stop-color="#1a1a28"/>
              <stop offset="54%" stop-color="#0e0e18"/>
              <stop offset="100%" stop-color="#1e1e2e"/>
            </radialGradient>
            <radialGradient id="shine" cx="38%" cy="33%" r="62%">
              <stop offset="0%"  stop-color="#d0191e" stop-opacity="0.5"/>
              <stop offset="45%" stop-color="#800000" stop-opacity="0.18"/>
              <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="hg" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#303048"/>
              <stop offset="100%" stop-color="#0a0a14"/>
            </radialGradient>
          </defs>
          <circle cx="41" cy="41" r="40" fill="url(#dg)"/>
          <circle cx="41" cy="41" r="37.5" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="0.6"/>
          <circle cx="41" cy="41" r="34"   fill="none" stroke="rgba(255,255,255,0.04)"  stroke-width="0.5"/>
          <circle cx="41" cy="41" r="30"   fill="none" stroke="rgba(255,255,255,0.05)"  stroke-width="0.5"/>
          <circle cx="41" cy="41" r="26"   fill="none" stroke="rgba(255,255,255,0.04)"  stroke-width="0.5"/>
          <circle cx="41" cy="41" r="22"   fill="none" stroke="rgba(255,255,255,0.05)"  stroke-width="0.5"/>
          <circle cx="41" cy="41" r="16.5" fill="#be1217"/>
          <circle cx="41" cy="41" r="16.5" fill="url(#shine)"/>
          <text x="41" y="40" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="6.5" font-weight="900" fill="white" letter-spacing="1.5">PSF</text>
          <text x="41" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="4" font-weight="700" fill="rgba(255,255,255,0.8)" letter-spacing="1.5">STEGEN</text>
          <circle cx="41" cy="41" r="4" fill="url(#hg)" stroke="rgba(255,255,255,0.12)" stroke-width="0.5"/>
          <circle cx="41" cy="41" r="39.5" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
        </svg>
      </div>
    </div>

    <div class="now-info">
      <div class="now-title" id="nowTitle">—</div>
      <div class="now-artist" id="nowArtist">Unbekannt</div>
    </div>
  </div>

  <!-- Live Seek Slider -->
  <div class="seek-wrap">
    <span class="time-label" id="timeCurrent">0:00</span>
    <input type="range" id="seekBar" min="0" max="100" value="0" step="0.1">
    <span class="time-label" id="timeTotal">0:00</span>
  </div>

  <!-- Volume -->
  <div class="volume-wrap">
    <span class="volume-icon" id="volIcon">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M11 5L6 9H2v6h4l5 4V5z"/>
        <path stroke-linecap="round" d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path stroke-linecap="round" d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </span>
    <input type="range" id="volumeBar" min="0" max="100" value="80" step="1">
    <span class="time-label" id="volPct" style="text-align:right">80%</span>
  </div>

  <!-- Controls: Shuffle | Prev | Play/Pause | Stop | Next -->
  <div class="controls-row">
    <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle">
      <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24" class="shuffle-icon">
        <path stroke-linecap="round" d="M16 3h5v5M4 20l5-5M14 9l2-2 5 5M4 4l10 10"/>
      </svg>
    </button>

    <button class="ctrl-btn" onclick="prevTrack()" title="Zurück">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M19 20L9 12l10-8v16zM5 4v16"/>
      </svg>
    </button>

    <button id="playBtn" onclick="togglePlay()" title="Play / Pause">
      <svg id="playIcon" width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>

    <button id="stopBtn" onclick="stopTrack()" title="Stop">
      <svg width="17" height="17" fill="currentColor" viewBox="0 0 24 24">
        <rect x="5" y="5" width="14" height="14" rx="2"/>
      </svg>
    </button>

    <button class="ctrl-btn" onclick="nextTrack()" title="Weiter">
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M5 4l10 8-10 8V4zM19 4v16"/>
      </svg>
    </button>
  </div>
</div>

<div id="toast"></div>
<audio id="audioPlayer" playsinline webkit-playsinline preload="auto"></audio>
<!-- Hidden element anchored in DOM for reliable iOS metadata reading -->
<audio id="metaReader" preload="metadata" style="display:none"></audio>

<script>
  const audio   = document.getElementById('audioPlayer');
  const cdDisc  = document.getElementById('cdDisc');

  let tracks   = [];
  let queue    = [];
  let currentIdx = -1;
  let shuffle  = false;
  let stopped  = false;
  let filteredTracks = [];
  let audioUnlocked = false;

  // ── iOS AUDIO UNLOCK ──────────────────────────────────
  // Safari requires a user gesture before any audio can play.
  // We silently unlock the audio context on the very first tap.
  function unlockAudio() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    audio.load();
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
    ctx.resume().then(() => ctx.close());
  }
  document.addEventListener('touchstart', unlockAudio, { once: true });
  document.addEventListener('click',      unlockAudio, { once: true });

  // ── FILE LOAD ──────────────────────────────────────────
  document.getElementById('fileInput').addEventListener('change', e => loadFiles(e.target.files));
  const dz = document.getElementById('dropZone');
  dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); loadFiles(e.dataTransfer.files); });

  // Hidden DOM audio element used ONLY for reading metadata — must be in DOM for iOS
  const metaAudio = document.getElementById('metaReader');

  function loadFiles(files) {
    // No filter — accept everything, browser will reject unplayable files at play time
    const all = Array.from(files);
    if (!all.length) return;

    let added = 0;
    const newTracks = [];
    for (const file of all) {
      if (tracks.find(t => t.name === file.name)) continue;
      const url   = URL.createObjectURL(file);
      const base  = file.name.replace(/\.[^.]+$/, '');
      const parts = base.split(' - ');
      const artist = parts.length > 1 ? parts[0].trim() : 'Unbekannt';
      const title  = parts.length > 1 ? parts.slice(1).join(' - ').trim() : base;
      const track  = { url, title, artist, name: file.name, duration: 0 };
      tracks.push(track);
      newTracks.push(track);
      added++;
    }

    updateTrackCount();
    renderLibrary();
    if (added) showToast(`${added} Track${added > 1 ? 's' : ''} geladen`);

    // Load durations using the DOM-anchored hidden audio element — required on iOS Safari
    let qi = 0;
    function loadNextMeta() {
      if (qi >= newTracks.length) { renderLibrary(); return; }
      const t = newTracks[qi];

      function onMeta() {
        cleanup();
        const d = metaAudio.duration;
        t.duration = (d && isFinite(d) && d > 0) ? d : 0;
        renderLibrary();
        qi++;
        loadNextMeta();
      }
      function onError() {
        cleanup();
        qi++;
        loadNextMeta();
      }
      function cleanup() {
        metaAudio.removeEventListener('loadedmetadata', onMeta);
        metaAudio.removeEventListener('durationchange', onMeta);
        metaAudio.removeEventListener('error', onError);
      }

      metaAudio.addEventListener('loadedmetadata', onMeta,  { once: true });
      metaAudio.addEventListener('durationchange', onMeta,  { once: true });
      metaAudio.addEventListener('error',          onError, { once: true });

      metaAudio.src     = t.url;
      metaAudio.preload = 'metadata';
      metaAudio.load();

      // Fallback: if neither event fires within 3s, skip
      setTimeout(() => { if (t.duration === 0) onError(); }, 3000);
    }
    loadNextMeta();
  }

  // ── RENDER LIBRARY ────────────────────────────────────
  function renderLibrary() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    filteredTracks = tracks.filter(t => t.title.toLowerCase().includes(q) || t.artist.toLowerCase().includes(q));
    const list = document.getElementById('trackList');

    if (!tracks.length) {
      list.innerHTML = `<div class="empty-state"><div class="icon">🎵</div><p>Keine Tracks geladen<br>Dateien oben hinzufügen</p></div>`;
      return;
    }
    if (!filteredTracks.length) {
      list.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>Keine Ergebnisse</p></div>`;
      return;
    }

    list.innerHTML = filteredTracks.map((t, i) => {
      const ri   = tracks.indexOf(t);
      const isP  = ri === currentIdx && !stopped;
      const dur  = t.duration ? fmtTime(t.duration) : '—';
      return `<div class="track-item ${isP ? 'playing' : ''}" onclick="playTrack(${ri})" style="animation-delay:${Math.min(i*16,180)}ms">
        <div class="track-num">${isP ? '▶' : i + 1}</div>
        <div class="track-art">🎵</div>
        <div class="track-info">
          <div class="track-title">${esc(t.title)}</div>
          <div class="track-meta">${esc(t.artist)}</div>
        </div>
        <div class="track-dur">${dur}</div>
        <button class="add-queue-btn" onclick="event.stopPropagation();addToQueue(${ri})" title="Zur Warteschlange">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>`;
    }).join('');
  }

  // ── RENDER QUEUE ──────────────────────────────────────
  function renderQueue() {
    const list  = document.getElementById('queueList');
    const badge = document.getElementById('queueBadge');
    badge.textContent = queue.length ? ` (${queue.length})` : '';

    if (!queue.length) {
      list.innerHTML = '<div class="queue-empty">Warteschlange leer —<br>spielt automatisch von vorne durch</div>';
      return;
    }
    list.innerHTML = queue.map((idx, qi) => {
      const t = tracks[idx];
      return `<div class="queue-item" data-qi="${qi}" draggable="true">
        <div class="drag-handle" title="Verschieben">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" d="M8 6h8M8 12h8M8 18h8"/>
          </svg>
        </div>
        <div class="queue-pos">${qi + 1}</div>
        <div class="queue-info">
          <div class="queue-title">${esc(t.title)}</div>
          <div class="track-meta" style="font-size:11px;color:var(--muted);margin-top:2px">${esc(t.artist)}</div>
        </div>
        <button class="queue-remove" onclick="removeFromQueue(${qi})">
          <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>`;
    }).join('');

    // Attach drag events
    initQueueDrag();
  }

  // ── DRAG TO REORDER ───────────────────────────────────
  let dragSrcQi = null;

  function initQueueDrag() {
    const items = document.querySelectorAll('#queueList .queue-item');

    items.forEach(item => {
      // ── MOUSE drag ──
      item.addEventListener('dragstart', e => {
        dragSrcQi = parseInt(item.dataset.qi);
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        document.querySelectorAll('.queue-item').forEach(i => i.classList.remove('drag-over-item'));
      });
      item.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        document.querySelectorAll('.queue-item').forEach(i => i.classList.remove('drag-over-item'));
        item.classList.add('drag-over-item');
      });
      item.addEventListener('drop', e => {
        e.preventDefault();
        const targetQi = parseInt(item.dataset.qi);
        if (dragSrcQi !== null && dragSrcQi !== targetQi) {
          const moved = queue.splice(dragSrcQi, 1)[0];
          queue.splice(targetQi, 0, moved);
          renderQueue();
        }
      });

      // ── TOUCH drag (iOS) ──
      let touchStartY = 0;
      let touchSrcQi  = null;

      item.addEventListener('touchstart', e => {
        touchSrcQi  = parseInt(item.dataset.qi);
        touchStartY = e.touches[0].clientY;
        item.classList.add('dragging');
      }, { passive: true });

      item.addEventListener('touchmove', e => {
        e.preventDefault();
        const y = e.touches[0].clientY;
        const all = [...document.querySelectorAll('#queueList .queue-item')];
        all.forEach(i => i.classList.remove('drag-over-item'));
        // find which item we're over
        const target = all.find(i => {
          const r = i.getBoundingClientRect();
          return y >= r.top && y <= r.bottom;
        });
        if (target && target !== item) target.classList.add('drag-over-item');
      }, { passive: false });

      item.addEventListener('touchend', e => {
        item.classList.remove('dragging');
        const y = e.changedTouches[0].clientY;
        const all = [...document.querySelectorAll('#queueList .queue-item')];
        const target = all.find(i => {
          const r = i.getBoundingClientRect();
          return y >= r.top && y <= r.bottom;
        });
        if (target) {
          const targetQi = parseInt(target.dataset.qi);
          if (touchSrcQi !== null && touchSrcQi !== targetQi) {
            const moved = queue.splice(touchSrcQi, 1)[0];
            queue.splice(targetQi, 0, moved);
            renderQueue();
            return;
          }
        }
        all.forEach(i => i.classList.remove('drag-over-item'));
      });
    });
  }

  // ── PLAYBACK ──────────────────────────────────────────
  function playTrack(idx) {
    currentIdx = idx;
    stopped    = false;
    const t    = tracks[idx];
    audio.src  = t.url;
    audio.load();

    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.catch(err => {
        // iOS sometimes needs a tiny delay after src change
        setTimeout(() => audio.play().catch(() => showToast('Tippe nochmal Play')), 300);
      });
    }

    document.getElementById('nowTitle').textContent  = t.title;
    document.getElementById('nowArtist').textContent = t.artist;
    document.getElementById('nowPlayingBar').classList.remove('hidden');
    setPlayIcon(false);
    cdDisc.classList.add('spinning');
    renderLibrary();

    // ── MEDIA SESSION (Lock Screen & Bluetooth controls) ──
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title:  t.title,
        artist: t.artist,
        album:  'PSF Stegen',
        artwork: [{ src: 'https://via.placeholder.com/512/be1217/ffffff?text=PSF', sizes: '512x512', type: 'image/png' }]
      });
      navigator.mediaSession.setActionHandler('play',           () => { audio.play(); });
      navigator.mediaSession.setActionHandler('pause',          () => { audio.pause(); });
      navigator.mediaSession.setActionHandler('nexttrack',      () => nextTrack());
      navigator.mediaSession.setActionHandler('previoustrack',  () => prevTrack());
      navigator.mediaSession.setActionHandler('stop',           () => stopTrack());
    }
  }

  function togglePlay() {
    if (currentIdx < 0 && tracks.length) { playTrack(0); return; }
    if (!audio.src) return;
    if (audio.paused) {
      stopped = false;
      const p = audio.play();
      if (p !== undefined) p.catch(() => showToast('Tippe nochmal Play'));
    } else {
      audio.pause();
    }
  }

  function stopTrack() {
    audio.pause();
    audio.currentTime = 0;
    stopped = true;
    cdDisc.classList.remove('spinning');
    setPlayIcon(true);
    seekBar.value = 0;
    updateSeekStyle(0);
    document.getElementById('timeCurrent').textContent = '0:00';
    renderLibrary();
  }

  function nextTrack() {
    if (!tracks.length) return;
    if (queue.length) {
      // use queue first
      playTrack(queue.shift());
      renderQueue();
    } else {
      // No queue → loop through library
      let next;
      if (shuffle) {
        do { next = Math.floor(Math.random() * tracks.length); }
        while (next === currentIdx && tracks.length > 1);
      } else {
        next = (currentIdx + 1) % tracks.length; // wraps 0 after last
      }
      playTrack(next);
    }
  }

  function prevTrack() {
    if (!tracks.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    playTrack(currentIdx <= 0 ? tracks.length - 1 : currentIdx - 1);
  }

  function toggleShuffle() {
    shuffle = !shuffle;
    document.getElementById('shuffleBtn').classList.toggle('active', shuffle);
    showToast(shuffle ? 'Shuffle an' : 'Shuffle aus');
  }

  function addToQueue(idx) {
    queue.push(idx);
    renderQueue();
    showToast(`„${tracks[idx].title.substring(0, 22)}" zur Queue`);
  }

  function removeFromQueue(qi) { queue.splice(qi, 1); renderQueue(); }
  function clearQueue()        { queue = []; renderQueue(); showToast('Queue geleert'); }

  function setPlayIcon(paused) {
    document.getElementById('playIcon').innerHTML = paused
      ? '<path d="M8 5v14l11-7z"/>'
      : '<path d="M6 19h4V5H6zm8-14v14h4V5z"/>';
  }

  // ── AUDIO EVENTS ──────────────────────────────────────
  let isSeeking = false;
  const seekBar   = document.getElementById('seekBar');
  const volumeBar = document.getElementById('volumeBar');

  // Set initial volume
  audio.volume = 0.8;

  function updateSeekStyle(pct) {
    seekBar.style.background =
      `linear-gradient(to right, #d0191e 0%, #f5a623 ${pct}%, #1a1a26 ${pct}%)`;
  }
  function updateVolStyle(pct) {
    volumeBar.style.background =
      `linear-gradient(to right, #f5a623 0%, #e8d5b0 ${pct}%, #1a1a26 ${pct}%)`;
  }
  updateSeekStyle(0);
  updateVolStyle(80);

  // Seek: start drag
  seekBar.addEventListener('mousedown',  () => isSeeking = true);
  seekBar.addEventListener('touchstart', () => isSeeking = true, { passive: true });

  // Seek: live drag visual
  seekBar.addEventListener('input', () => {
    const pct = Number(seekBar.value);
    updateSeekStyle(pct);
    if (audio.duration) {
      document.getElementById('timeCurrent').textContent = fmtTime((pct / 100) * audio.duration);
    }
  });

  // Seek: release → jump
  seekBar.addEventListener('change', () => {
    if (audio.duration) audio.currentTime = (seekBar.value / 100) * audio.duration;
    isSeeking = false;
  });

  // Volume bar
  volumeBar.addEventListener('input', () => {
    const pct = Number(volumeBar.value);
    audio.volume = pct / 100;
    updateVolStyle(pct);
    document.getElementById('volPct').textContent = pct + '%';
    // Update icon: muted vs low vs high
    const icon = document.getElementById('volIcon');
    if (pct === 0) {
      icon.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15" stroke-linecap="round"/><line x1="17" y1="9" x2="23" y2="15" stroke-linecap="round"/></svg>`;
    } else if (pct < 50) {
      icon.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M11 5L6 9H2v6h4l5 4V5z"/><path stroke-linecap="round" d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`;
    } else {
      icon.innerHTML = `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M11 5L6 9H2v6h4l5 4V5z"/><path stroke-linecap="round" d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path stroke-linecap="round" d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>`;
    }
  });

  audio.addEventListener('timeupdate', () => {
    if (!audio.duration || isSeeking) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    seekBar.value = pct;
    updateSeekStyle(pct);
    document.getElementById('timeCurrent').textContent = fmtTime(audio.currentTime);
    document.getElementById('timeTotal').textContent   = fmtTime(audio.duration);
  });

  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('timeTotal').textContent = fmtTime(audio.duration);
    seekBar.value = 0;
    updateSeekStyle(0);
  });

  audio.addEventListener('ended', nextTrack);   // auto-advance with loop

  audio.addEventListener('play', () => {
    setPlayIcon(false);
    cdDisc.classList.add('spinning');
  });
  audio.addEventListener('pause', () => {
    setPlayIcon(true);
    cdDisc.classList.remove('spinning');
  });

  // ── UTILS ─────────────────────────────────────────────
  function filterTracks() { renderLibrary(); }

  function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', ['library','queue'][i] === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
  }

  function updateTrackCount() {
    document.getElementById('trackCount').textContent = `${tracks.length} Track${tracks.length !== 1 ? 's' : ''}`;
  }

  function fmtTime(s) {
    if (!s || isNaN(s)) return '0:00';
    return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
